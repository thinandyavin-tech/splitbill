services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-splitbill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-splitbill}
      POSTGRES_DB: splitbill
    ports:
      - "5432:5432"
    volumes:
      - ./backend/docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-splitbill} -d splitbill"]
      interval: 2s
      retries: 15

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-splitbill}:${POSTGRES_PASSWORD:-splitbill}@db:5432/splitbill
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
